# =============================================================
# git-GRAPH — Unified Capability Registry
# =============================================================
# $schema: ../../schemas/capability_registry.schema.json
# schema_version: "2.0"
# last_updated: "2026-06-21T00:00:00Z"
#
# Maps each high-level capability to:
#   semantic_hints  — token strings for semantic matching
#   behaviors       — pattern_ids from the patterns library
#   description     — human-readable summary
#   ontology_domain — source domain ontology file
# =============================================================

