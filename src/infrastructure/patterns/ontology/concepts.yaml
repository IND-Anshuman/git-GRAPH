# =============================================================
# git-GRAPH — Master Concepts Map
# =============================================================
# $schema: ../../../../schemas/concepts.schema.json
schema_version: "4.0"
ontology_version: "4.2.0"
last_updated: "2026-06-21T00:00:00Z"

domains:
  # ─── SECURITY ─────────────────────────────────────────────
  - id: security
    name: Security
    description: "Mechanisms enforcing data protection, identity validation, and access control."
    concepts:
      - id: security.authentication
        name: Authentication
        description: "Verification of user, service, or system identities."
        required_patterns:
          - auth_bcrypt_verification
          - auth_sha256_verification
          - auth_jwt_verification
          - auth_argon2_verification
          - auth_passlib_verify
        optional_patterns:
          - auth_bcrypt_hash
          - auth_jwt_generation
          - auth_direct_compare
          - oauth2_authorization_code
          - oauth2_token_refresh
          - oauth2_client_credentials
          - sso_redirect
          - session_read
          - session_write
          - session_invalidation
          - login_required_guard
        min_base_confidence: 0.80

      - id: security.authorization
        name: Authorization
        description: "Enforcement of permission-based and role-based access rights."
        required_patterns:
          - authz_permission_check
          - authz_rbac
        optional_patterns:
          - abac_policy_check
          - casbin_enforce
          - opa_query
        min_base_confidence: 0.75

      - id: security.cryptography
        name: Cryptography
        description: "Encryption, decryption, and cryptographic signing operations."
        required_patterns:
          - aes_encrypt
          - aes_decrypt
          - fernet_encrypt
          - hmac_sign
          - rsa_sign
        optional_patterns:
          - rsa_encrypt
          - rsa_decrypt
          - ec_sign
          - ec_verify
          - ed25519_sign
          - chacha20_encrypt
          - fernet_decrypt
          - ecdsa_asymmetric
          - hmac_verify
          - jwt_signing
        min_base_confidence: 0.80

  # ─── DATA MANAGEMENT ──────────────────────────────────────
  - id: data_management
    name: Data Management
    description: "Data lifecycle, transactions, and retrieval mechanisms."
    concepts:
      - id: data_management.caching
        name: Caching
        description: "High-performance memory buffers and distributed cache lookups."
        required_patterns:
          - cache_memory_dict
          - cache_lru_cache
          - cache_redis_lookup
          - cache_redis_set
        optional_patterns:
          - cache_redis_cluster
          - cache_invalidation
          - memcached_get
          - memcached_set
          - memcached_delete
        min_base_confidence: 0.70

      - id: data_management.persistence
        name: Persistence
        description: "Persistent database operations and repository structures."
        required_patterns:
          - db_raw_sql_execute
          - db_orm_sqlalchemy_query
          - db_repository_pattern
          - db_transaction
        optional_patterns:
          - db_orm_django_query
          - db_orm_peewee_query
          - db_orm_tortoise_query
          - db_orm_sqlmodel_query
          - db_orm_prisma_query
          - db_orm_drizzle_query
          - db_schema_migration
        min_base_confidence: 0.70

      - id: data_management.serialization
        name: Serialization
        description: "Data serialization and deserialization formats."
        required_patterns:
          - json_serialize
          - json_deserialize
        optional_patterns:
          - pydantic_serialize
          - marshmallow_serialize
          - protobuf_serialize
          - msgpack_serialize
          - pickle_serialize
          - pickle_deserialize
        min_base_confidence: 0.65

  # ─── RELIABILITY ──────────────────────────────────────────
  - id: reliability
    name: Reliability
    description: "System recovery, backoff retries, timeouts, and network circuit breakers."
    concepts:
      - id: reliability.retry
        name: Retry Logic
        description: "Automatic operations retries under failure conditions."
        required_patterns:
          - retry_tenacity
          - retry_manual_loop
          - retry_backoff
        optional_patterns:
          - fixed_interval_retry
          - timeout_deadline
          - timeout_async
        min_base_confidence: 0.75

      - id: reliability.circuit_breaker
        name: Circuit Breaker
        description: "Circuit breaker pattern to prevent cascade failure propagation."
        required_patterns:
          - circuit_breaker_pybreaker
          - circuit_breaker_manual
        optional_patterns:
          - circuit_breaker_fallback
        min_base_confidence: 0.80

      - id: reliability.rate_limiting
        name: Rate Limiting
        description: "Rate limiting rules and middleware checks."
        required_patterns:
          - token_bucket_check
          - fixed_window_check
          - sliding_window_check
          - slowapi_limit
        optional_patterns:
          - django_ratelimit_decorator
          - redis_sliding_window
          - rate_limiter_acquire
        min_base_confidence: 0.75

  # ─── COMMUNICATION ────────────────────────────────────────
  - id: communication
    name: Communication
    description: "API integrations, messaging, and publisher/subscriber event patterns."
    concepts:
      - id: communication.messaging
        name: Messaging
        description: "Asynchronous messaging brokers and queue publishing/consuming."
        required_patterns:
          - msg_publish_kafka
          - msg_publish_rabbitmq
          - msg_consume
        optional_patterns:
          - msg_kafka_streams
          - msg_sqs
          - msg_azure_servicebus
          - msg_gcp_pubsub
          - msg_celery
          - msg_nats
        min_base_confidence: 0.75

      - id: communication.api_integration
        name: API Integration
        description: "Integration endpoints, REST queries, gRPC, and GraphQL client adapters."
        required_patterns:
          - api_requests_call
          - api_httpx_call
          - api_endpoint_handler
        optional_patterns:
          - api_aiohttp_call
          - api_urllib3_call
          - api_http_client_call
          - api_grpc_call
          - api_fetch_call
          - api_axios_call
          - gql_query
          - gql_mutation
          - graphql_post_request
        min_base_confidence: 0.70

      - id: communication.event_handling
        name: Event Handling
        description: "Domain event emission, subscription, and signal-based communication."
        required_patterns:
          - event_emit
        optional_patterns:
          - django_signal_send
          - django_signal_receiver
          - blinker_connect
          - event_handler_decorator
          - node_event_emitter_emit
        min_base_confidence: 0.70

  # ─── PRESENTATION ─────────────────────────────────────────
  - id: presentation
    name: Presentation
    description: "API request routing, input validation, and middleware handling."
    concepts:
      - id: presentation.api_handling
        name: API Request Handling
        description: "Inbound HTTP/API routing, endpoint handlers, and middleware interceptors."
        required_patterns:
          - api_endpoint_handler
        optional_patterns:
          - fastapi_middleware
          - django_middleware_class
          - express_middleware
          - flask_before_request
          - nestjs_interceptor
          - koa_middleware
        min_base_confidence: 0.70

      - id: presentation.validation
        name: Input Validation
        description: "Validation of incoming data against schemas before processing."
        required_patterns:
          - pydantic_field_validator
        optional_patterns:
          - marshmallow_validate
          - jsonschema_validate
          - zod_parse
          - cerberus_validate
          - attrs_validate
          - io_ts_parse
        min_base_confidence: 0.70

  # ─── INTEGRATION ──────────────────────────────────────────
  - id: integration
    name: Integration
    description: "Third-party services, LLM integrations, audio, and external client adapters."
    concepts:
      - id: integration.ai_model
        name: AI Model Integration
        description: "Generative AI models, vector embeddings, and streaming text completions."
        required_patterns:
          - ai_model_invoke_gemini
        optional_patterns:
          - ai_model_invoke_openai
          - ai_model_invoke_anthropic
          - ai_model_invoke_langchain
          - ai_model_invoke_litellm
          - ai_model_invoke_ollama
          - ai_model_invoke_vllm
          - ai_model_streaming
          - ai_model_embedding
          - ai_embedding_generate
          - ai_rerank
        min_base_confidence: 0.80

      - id: integration.ai_agent
        name: AI Agent Workflows
        description: "Multi-step agent planning, execution, reflection, and tool use."
        required_patterns:
          - ai_agent_plan
          - ai_agent_execute
        optional_patterns:
          - ai_agent_reflect
          - ai_agent_evaluate
          - ai_tool_invoke
          - ai_guardrails
          - ai_workflow_langgraph
          - ai_workflow_multi_agent
          - ai_retrieve
          - ai_memory_read
          - ai_memory_write
        min_base_confidence: 0.80

      - id: integration.audio
        name: Audio Processing
        description: "Text-to-speech synthesis and speech-to-text transcription."
        required_patterns: []
        optional_patterns:
          - tts_parler_generation
          - stt_speech_to_text
        min_base_confidence: 0.75
