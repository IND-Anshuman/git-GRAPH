schema_version: "1.0"
patterns:
  - pattern_id: api_requests_call
    name: HTTP REST API Call (requests)
    pattern_version: "2.0.0"
    ontology_node_id: integration.http_client.rest_call
    base_confidence: 0.88
    index_keys:
      - "import:requests"
      - "call:requests.get"
      - "call:requests.post"
    rules:
      required_imports:
        - requests
      ast_features:
        - match_type: import
          target_module: requests
        - match_type: call
          target_module: requests
          target_function_pattern: "(get|post|put|delete|patch|head|request)"

  - pattern_id: api_httpx_call
    name: HTTP REST API Call (httpx)
    pattern_version: "2.0.0"
    ontology_node_id: integration.http_client.rest_call
    base_confidence: 0.88
    index_keys:
      - "import:httpx"
      - "call:httpx.get"
      - "call:client.get"
    rules:
      required_imports:
        - httpx
      ast_features:
        - match_type: import
          target_module: httpx
        - match_type: call
          target_module_pattern: "(httpx|client)"
          target_function_pattern: "(get|post|put|delete|patch)"

  - pattern_id: api_aiohttp_call
    name: HTTP REST API Call (aiohttp)
    pattern_version: "2.0.0"
    ontology_node_id: integration.http_client.rest_call
    base_confidence: 0.90
    index_keys:
      - "import:aiohttp"
      - "call:ClientSession"
    rules:
      required_imports:
        - aiohttp
      ast_features:
        - match_type: import
          target_module: aiohttp
        - match_type: call
          target_method: ClientSession

  - pattern_id: api_urllib3_call
    name: HTTP REST API Call (urllib3)
    pattern_version: "2.0.0"
    ontology_node_id: integration.http_client.rest_call
    base_confidence: 0.90
    index_keys:
      - "import:urllib3"
      - "call:PoolManager"
    rules:
      required_imports:
        - urllib3
      ast_features:
        - match_type: import
          target_module: urllib3
        - match_type: call
          target_method: PoolManager

  - pattern_id: api_http_client_call
    name: HTTP REST API Call (http.client)
    pattern_version: "2.0.0"
    ontology_node_id: integration.http_client.rest_call
    base_confidence: 0.88
    index_keys:
      - "import:http.client"
      - "call:HTTPConnection"
    rules:
      required_imports:
        - http.client
      ast_features:
        - match_type: import
          target_module: http.client
        - match_type: call
          target_method: HTTPConnection

  - pattern_id: api_grpc_call
    name: gRPC Client Call
    pattern_version: "2.0.0"
    ontology_node_id: integration.http_client.rest_call
    base_confidence: 0.92
    index_keys:
      - "import:grpc"
      - "call:insecure_channel"
      - "call:secure_channel"
    rules:
      required_imports:
        - grpc
      ast_features:
        - match_type: import
          target_module_pattern: "(grpc|grpc\\.aio)"
        - match_type: call
          target_method_pattern: "(insecure_channel|secure_channel)"

  - pattern_id: api_endpoint_handler
    name: API Endpoint Handler
    pattern_version: "2.0.0"
    ontology_node_id: presentation.api_handling.endpoint
    base_confidence: 0.87
    index_keys:
      - "decorator:app.get"
      - "decorator:app.post"
      - "decorator:router.get"
      - "decorator:route"
    rules:
      ast_features:
        - match_type: decorator
          target_method_pattern: "(get|post|put|delete|patch)"
          target_object_pattern: "(app|router|api|blueprint)"

  - pattern_id: ai_model_invoke_gemini
    name: Gemini GenAI Client Call
    pattern_version: "2.0.0"
    ontology_node_id: ai.models.invoke
    base_confidence: 0.95
    index_keys:
      - "import:google.genai"
      - "call:generate_content"
    rules:
      ast_features:
        - match_type: import
          target_module: google.genai
        - match_type: call
          target_function: generate_content

  - pattern_id: tts_parler_generation
    name: Parler TTS Audio Generation
    pattern_version: "2.0.0"
    ontology_node_id: integration.audio.tts
    base_confidence: 0.90
    index_keys:
      - "import:parler_tts"
      - "call:generate"
    rules:
      ast_features:
        - match_type: import
          target_module: parler_tts
        - match_type: call
          target_function: generate

  - pattern_id: api_fetch_call
    name: HTTP REST API Call (fetch)
    pattern_version: "2.0.0"
    ontology_node_id: integration.http_client.rest_call
    base_confidence: 0.90
    index_keys:
      - "call:fetch"
    rules:
      ast_features:
        - match_type: call
          target_function: fetch
          description: "fetch API request invocation"
      string_literals:
        - pattern: "https?://"
        - pattern_pattern: "(GET|POST|PUT|DELETE|PATCH)"

  - pattern_id: api_axios_call
    name: HTTP REST API Call (axios)
    pattern_version: "2.0.0"
    ontology_node_id: integration.http_client.rest_call
    base_confidence: 0.92
    index_keys:
      - "call:axios"
      - "call:axios.get"
      - "call:axios.post"
      - "import:axios"
    rules:
      ast_features:
        - match_type: call
          target_function: axios
          description: "axios API request invocation"

  - pattern_id: gql_query
    name: GraphQL Client Query
    pattern_version: "2.0.0"
    ontology_node_id: integration.http_client.graphql_call
    base_confidence: 0.93
    index_keys:
      - "call:execute"
      - "import:gql"
    rules:
      ast_features:
        - match_type: call
          target_method: execute
          target_class_pattern: "Client"
        - match_type: import
          target_module: gql
      negative_indicators:
        - symbol: "mutation"

  - pattern_id: gql_mutation
    name: GraphQL Client Mutation
    pattern_version: "2.0.0"
    ontology_node_id: integration.http_client.graphql_call
    base_confidence: 0.93
    index_keys:
      - "call:execute"
      - "import:gql"
    rules:
      ast_features:
        - match_type: call
          target_method: execute
          target_class_pattern: "Client"
        - match_type: import
          target_module: gql
      string_literals:
        - pattern: "mutation"

  - pattern_id: graphql_post_request
    name: GraphQL Raw Post Request
    pattern_version: "2.0.0"
    ontology_node_id: integration.http_client.graphql_call
    base_confidence: 0.85
    index_keys:
      - "call:post"
    rules:
      ast_features:
        - match_type: call
          target_function_pattern: "(post|request)"
      string_literals:
        - pattern: "query"

  - pattern_id: stt_speech_to_text
    name: Speech-to-Text Transcription
    pattern_version: "2.0.0"
    ontology_node_id: integration.audio.stt
    base_confidence: 0.93
    index_keys:
      - "import:whisper"
      - "import:speech_recognition"
      - "call:transcribe"
      - "call:speech_to_text"
      - "call:recognize"
    rules:
      ast_features:
        - match_type: import
          target_module_pattern: "(whisper|speech_recognition)"
        - match_type: call
          target_function_pattern: "(transcribe|speech_to_text|recognize)"
