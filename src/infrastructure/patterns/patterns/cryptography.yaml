schema_version: "1.0"
patterns:
  - pattern_id: aes_encrypt
    name: AES Symmetric Encryption
    pattern_version: "2.0.0"
    ontology_node_id: security.cryptography.symmetric
    base_confidence: 0.92
    index_keys:
      - "call:AES.new"
      - "call:encryptor"
      - "import:cryptography"
    rules:
      ast_features:
        - match_type: call
          target_method: new
          target_class: AES
        - match_type: call
          target_method: encryptor
        - match_type: import
          target_module_pattern: "(cryptography|Crypto)"

  - pattern_id: aes_decrypt
    name: AES Symmetric Decryption
    pattern_version: "2.0.0"
    ontology_node_id: security.cryptography.symmetric
    base_confidence: 0.92
    index_keys:
      - "call:AES.new"
      - "call:decryptor"
      - "import:cryptography"
    rules:
      ast_features:
        - match_type: call
          target_method: new
          target_class: AES
        - match_type: call
          target_method: decryptor
        - match_type: import
          target_module_pattern: "(cryptography|Crypto)"

  - pattern_id: chacha20_encrypt
    name: ChaCha20 Symmetric Encryption
    pattern_version: "2.0.0"
    ontology_node_id: security.cryptography.symmetric
    base_confidence: 0.94
    index_keys:
      - "call:ChaCha20"
      - "import:cryptography"
    rules:
      ast_features:
        - match_type: call
          target_method_pattern: "(new|encrypt)"
          target_class_pattern: "ChaCha20"
        - match_type: import
          target_module: cryptography

  - pattern_id: fernet_encrypt
    name: Fernet Symmetric Encryption
    pattern_version: "2.0.0"
    ontology_node_id: security.cryptography.symmetric
    base_confidence: 0.95
    index_keys:
      - "call:Fernet.encrypt"
      - "import:cryptography.fernet"
    rules:
      ast_features:
        - match_type: call
          target_method: encrypt
          target_class: Fernet
        - match_type: import
          target_module: cryptography.fernet

  - pattern_id: fernet_decrypt
    name: Fernet Symmetric Decryption
    pattern_version: "2.0.0"
    ontology_node_id: security.cryptography.symmetric
    base_confidence: 0.95
    index_keys:
      - "call:Fernet.decrypt"
      - "import:cryptography.fernet"
    rules:
      ast_features:
        - match_type: call
          target_method: decrypt
          target_class: Fernet
        - match_type: import
          target_module: cryptography.fernet

  - pattern_id: rsa_encrypt
    name: RSA Asymmetric Encryption
    pattern_version: "2.0.0"
    ontology_node_id: security.cryptography.asymmetric
    base_confidence: 0.93
    index_keys:
      - "call:rsa.encrypt"
      - "call:public_key.encrypt"
      - "import:cryptography"
    rules:
      ast_features:
        - match_type: call
          target_method: encrypt
        - match_type: import
          target_module_pattern: "(cryptography|rsa)"

  - pattern_id: rsa_decrypt
    name: RSA Asymmetric Decryption
    pattern_version: "2.0.0"
    ontology_node_id: security.cryptography.asymmetric
    base_confidence: 0.93
    index_keys:
      - "call:rsa.decrypt"
      - "call:private_key.decrypt"
      - "import:cryptography"
    rules:
      ast_features:
        - match_type: call
          target_method: decrypt
        - match_type: import
          target_module_pattern: "(cryptography|rsa)"

  - pattern_id: ecdsa_asymmetric
    name: ECDSA / EC Asymmetric Key Operations
    pattern_version: "2.0.0"
    ontology_node_id: security.cryptography.asymmetric
    base_confidence: 0.94
    index_keys:
      - "call:ECDSA"
      - "call:EC"
      - "call:public_key"
      - "call:private_key"
    rules:
      ast_features:
        - match_type: call
          target_method_pattern: "(public_key|private_key|generate_private_key)"
        - match_type: import
          target_module_pattern: "(cryptography|ecdsa)"

  - pattern_id: ec_sign
    name: Elliptic Curve Signature Creation
    pattern_version: "2.0.0"
    ontology_node_id: security.cryptography.asymmetric
    base_confidence: 0.94
    index_keys:
      - "call:private_key.sign"
      - "import:cryptography"
    rules:
      ast_features:
        - match_type: call
          target_method: sign
        - match_type: import
          target_module_pattern: "(cryptography|ecdsa)"

  - pattern_id: ec_verify
    name: Elliptic Curve Signature Verification
    pattern_version: "2.0.0"
    ontology_node_id: security.cryptography.asymmetric
    base_confidence: 0.94
    index_keys:
      - "call:public_key.verify"
      - "import:cryptography"
    rules:
      ast_features:
        - match_type: call
          target_method: verify
        - match_type: import
          target_module_pattern: "(cryptography|ecdsa)"

  - pattern_id: hmac_sign
    name: HMAC Signature Creation
    pattern_version: "2.0.0"
    ontology_node_id: security.cryptography.signing
    base_confidence: 0.90
    index_keys:
      - "call:hmac.new"
      - "import:hmac"
    rules:
      ast_features:
        - match_type: call
          target_module: hmac
          target_function: new
        - match_type: import
          target_module: hmac

  - pattern_id: hmac_verify
    name: HMAC Signature Verification
    pattern_version: "2.0.0"
    ontology_node_id: security.cryptography.signing
    base_confidence: 0.91
    index_keys:
      - "call:compare_digest"
      - "import:hmac"
    rules:
      ast_features:
        - match_type: call
          target_function: compare_digest
        - match_type: import
          target_module: hmac

  - pattern_id: jwt_signing
    name: JWT Token Sign and Verify
    pattern_version: "2.0.0"
    ontology_node_id: security.cryptography.signing
    base_confidence: 0.94
    index_keys:
      - "call:jwt.encode"
      - "call:jwt.decode"
      - "import:jwt"
    rules:
      ast_features:
        - match_type: call
          target_method_pattern: "(encode|decode)"
          target_class: jwt
        - match_type: import
          target_module: jwt
