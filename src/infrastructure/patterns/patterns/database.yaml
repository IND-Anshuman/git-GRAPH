schema_version: "1.0"
patterns:
  - pattern_id: db_raw_sql_execute
    name: Raw SQL Execution
    pattern_version: "1.0.0"
    ontology_node_id: data_management.database.raw_sql
    base_confidence: 0.88
    index_keys:
      - "call:cursor.execute"
      - "call:execute"
      - "call:connection.execute"
    rules:
      ast_features:
        - match_type: call
          target_method: execute
          target_class_pattern: "(cursor|Cursor|connection|Connection)"
      string_literals:
        - pattern: "^(SELECT|INSERT|UPDATE|DELETE|CREATE|DROP)"
          description: "SQL keyword in string argument"

  - pattern_id: db_orm_sqlalchemy_query
    name: SQLAlchemy ORM Query
    pattern_version: "1.0.0"
    ontology_node_id: data_management.database.orm_query
    base_confidence: 0.92
    index_keys:
      - "import:sqlalchemy"
      - "call:session.query"
      - "call:query"
      - "call:filter"
    rules:
      ast_features:
        - match_type: import
          target_module_pattern: "sqlalchemy"
        - match_type: call
          target_method_pattern: "(query|filter|filter_by|select|execute)"

  - pattern_id: db_repository_pattern
    name: Repository Pattern
    pattern_version: "1.0.0"
    ontology_node_id: data_management.database.repository_pattern
    base_confidence: 0.82
    index_keys:
      - "call:find"
      - "call:save"
      - "call:delete"
      - "call:get_by"
      - "import:sqlalchemy"
    rules:
      ast_features:
        - match_type: call
          target_method_pattern: "(find|save|delete|get_by)"
          target_class_pattern: "(Repository|Repo|Store|DAO|DataAccessObject)"
        - match_type: import
          target_module_pattern: "(sqlalchemy|peewee|django.db|tortoise)"
      negative_indicators:
        - symbol: "Controller"
        - symbol: "Service"
        - symbol: "Middleware"

  - pattern_id: db_transaction
    name: Database Transaction
    pattern_version: "1.0.0"
    ontology_node_id: data_management.database.transaction
    base_confidence: 0.87
    index_keys:
      - "call:commit"
      - "call:rollback"
      - "call:begin"
    rules:
      ast_features:
        - match_type: call
          target_method_pattern: "(commit|rollback|begin_transaction|start_transaction)"

  - pattern_id: db_schema_migration
    name: Database Schema Migration
    pattern_version: "1.0.0"
    ontology_node_id: data_management.migration.schema_migration
    base_confidence: 0.94
    index_keys:
      - "import:alembic"
      - "import:flyway"
      - "import:liquibase"
      - "call:create_table"
      - "call:alter_table"
      - "call:add_column"
    rules:
      ast_features:
        - match_type: import
          target_module_pattern: "(alembic|flyway|liquibase)"
        - match_type: call
          target_method_pattern: "(create_table|alter_table|add_column|create_index)"
