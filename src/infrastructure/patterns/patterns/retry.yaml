schema_version: "1.0"
patterns:
  - pattern_id: retry_tenacity
    name: Retry with Tenacity
    pattern_version: "1.0.0"
    ontology_node_id: reliability.retry.max_attempts
    base_confidence: 0.95
    index_keys:
      - "import:tenacity"
      - "decorator:retry"
    rules:
      ast_features:
        - match_type: import
          target_module: tenacity
        - match_type: decorator
          target_function_pattern: "(retry|Retrying)"

  - pattern_id: retry_manual_loop
    name: Manual Retry Loop
    pattern_version: "1.0.0"
    ontology_node_id: reliability.retry.max_attempts
    base_confidence: 0.78
    index_keys:
      - "struct:retry_loop"
    rules:
      ast_features:
        - match_type: while_loop
          description: "While loop with attempt counter"
        - match_type: attribute_access
          target_attribute_pattern: "(attempt|retry|retries|max_retries)"
        - match_type: comparison
          operators: ["<", "<=", ">", ">="]
          description: "Max retries threshold check"

  - pattern_id: retry_backoff
    name: Exponential Backoff Retry
    pattern_version: "1.0.0"
    ontology_node_id: reliability.retry.exponential_backoff
    base_confidence: 0.86
    index_keys:
      - "call:time.sleep"
      - "call:sleep"
      - "struct:exponential"
    rules:
      ast_features:
        - match_type: call
          target_function: sleep
        - match_type: binary_op
          operators: ["**", "*"]
          description: "Exponential or multiplicative delay computation"

  - pattern_id: fixed_interval_retry
    name: Fixed Interval Retry Loop
    pattern_version: "1.0.0"
    ontology_node_id: reliability.retry.fixed_interval
    base_confidence: 0.80
    index_keys:
      - "call:sleep"
      - "import:time"
    rules:
      ast_features:
        - match_type: call
          target_function: sleep
        - match_type: while_loop
          description: "Retry loop with fixed sleep delay"
      negative_indicators:
        - symbol: "**"
        - symbol: "backoff"

  - pattern_id: timeout_deadline
    name: Timeout Deadline
    pattern_version: "1.0.0"
    ontology_node_id: reliability.timeout.deadline
    base_confidence: 0.90
    index_keys:
      - "call:settimeout"
      - "call:timeout"
    rules:
      ast_features:
        - match_type: call
          target_method_pattern: "(settimeout|timeout|with_timeout)"

  - pattern_id: timeout_async
    name: Async Timeout
    pattern_version: "1.0.0"
    ontology_node_id: reliability.timeout.async_timeout
    base_confidence: 0.92
    index_keys:
      - "call:asyncio.wait_for"
      - "import:asyncio"
      - "call:wait_for"
    rules:
      ast_features:
        - match_type: call
          target_function_pattern: "wait_for"
        - match_type: import
          target_module: "asyncio"
