# $schema: ../../../../schemas/patterns_file.schema.json
schema_version: "2.0"
patterns:
  - pattern_id: session_read
    name: Server-Side Session Read
    pattern_version: "2.0.0"
    ontology_node_id: security.authentication.session
    base_confidence: 0.85
    index_keys:
      - "subscript:session"
      - "call:session.get"
      - "call:request.session.get"
    rules:
      required_imports:
        - flask
        - django
      ast_features:
        - match_type: subscript
          description: "Reading from session variable dictionary"
        - match_type: call
          target_method: get
          target_class_pattern: "(session|request\\.session|flask\\.session|django\\.session)"

  - pattern_id: session_write
    name: Server-Side Session Write
    pattern_version: "2.0.0"
    ontology_node_id: security.authentication.session
    base_confidence: 0.85
    index_keys:
      - "subscript:session"
      - "call:session.set"
      - "call:request.session.set"
    rules:
      required_imports:
        - flask
        - django
      ast_features:
        - match_type: subscript
          description: "Writing to session variable dictionary"
        - match_type: call
          target_method: set
          target_class_pattern: "(session|request\\.session|flask\\.session|django\\.session)"

  - pattern_id: session_invalidation
    name: Session Invalidation
    pattern_version: "2.0.0"
    ontology_node_id: security.authentication.session
    base_confidence: 0.85
    index_keys:
      - "call:session.clear"
      - "call:session.destroy"
      - "call:logout"
    rules:
      ast_features:
        - match_type: call
          target_method_pattern: "(clear|destroy|invalidate|logout|flush)"

  - pattern_id: login_required_guard
    name: Login Required Guard
    pattern_version: "2.0.0"
    ontology_node_id: security.authentication.session
    base_confidence: 0.90
    index_keys:
      - "decorator:login_required"
    rules:
      ast_features:
        - match_type: decorator
          target_function_pattern: "(login_required|require_login|auth_required)"

  - pattern_id: cookie_session
    name: Cookie-Based Session Management
    pattern_version: "1.0.0"
    ontology_node_id: security.authentication.session
    base_confidence: 0.82
    calibration_notes: "Setting HttpOnly/Secure cookies is the standard session cookie pattern; medium confidence as cookie ops have many uses."
    index_keys:
      - "call:set_cookie"
      - "call:delete_cookie"
    rules:
      ast_features:
        - match_type: call
          target_method_pattern: "(set_cookie|delete_cookie|get_cookie)"
      string_literals:
        - pattern: "(HttpOnly|Secure|SameSite)"
          description: "Secure cookie attribute indicates session usage"
    tags: [cookie, flask, django, express]

  - pattern_id: redis_session_store
    name: Redis-Backed Session Store
    pattern_version: "1.0.0"
    ontology_node_id: security.authentication.session
    base_confidence: 0.89
    calibration_notes: "Explicit session store backed by Redis is unambiguous when redis import accompanies session access."
    index_keys:
      - "import:flask_session"
      - "import:connect-redis"
      - "import:express-session"
    rules:
      ast_features:
        - match_type: import
          target_module_pattern: "(flask_session|connect-redis|express-session|django_redis)"
    tags: [redis, session, flask, express, django]
